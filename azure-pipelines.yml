
trigger:
  - none

pool:
  name: application

variables:
- group: owasp


stages:
  - stage: CI
    displayName: Python Build and Publish
    jobs:
      - job: PythonBuild
        displayName: Python Application Build

        steps:
          - checkout: self
            fetchDepth: 0

          - task: Gitleaks@3
            displayName: Gitleaks
            inputs:
              scanlocation: '$(Build.SourcesDirectory)'
              configtype: 'default'
              reportformat: 'sarif'
              reportname: 'gitleakscan_report'
            continueOnError: true

          - task: dependency-check-build-task@6
            displayName: 'OWASP Dependency Check'
            retryCountOnTaskFailure: 2
            inputs:
              projectName: 'Python App'
              scanPath: '$(Build.SourcesDirectory)'
              format: 'HTML'
              uploadReports: true
              nvdApiKey: '$(NVD_API_KEY)'
              additionalArguments: '--nvdMaxRetryCount 20'
            continueOnError: true


          - task: UsePythonVersion@0
            displayName: 'Use Python 3.12'
            inputs:
              versionSpec: '3.12'
              architecture: 'x64'

          - task: PowerShell@2
            displayName: 'Install Python Dependencies'
            inputs:
              targetType: 'inline'
              script: |
                python --version
                python -m pip install --upgrade pip setuptools wheel

                python -m pip install --only-binary=:all: -r requirements.txt



          - task: PowerShell@2
            displayName: 'Set up Java 17'
            inputs:
              targetType: 'inline'
              script: |
                $javaHome = 'C:\Program Files\Eclipse Adoptium\jdk-17.0.20.101-hotspot'

                if (!(Test-Path "$javaHome\bin\java.exe")) {
                  throw "Java 17 not found"
                }

                Write-Host "##vso[task.setvariable variable=JAVA_HOME]$javaHome"
                Write-Host "##vso[task.prependpath]$javaHome\bin"

                & "$javaHome\bin\java.exe" -version


          - task: SonarQubePrepare@8
            displayName: 'Prepare SonarQube Analysis'
            inputs:
              SonarQube: 'Sonarqube'
              scannerMode: 'cli'
              configMode: 'manual'
              cliProjectKey: 'Python-app'
              cliProjectName: 'Python-app'
              cliSources: '.'
              extraProperties: |
                sonar.exclusions=**/.venv/**,**/venv/**,**/__pycache__/**,**/site-packages/**,**/build/**,**/dist/**,**/.git/**

          
          - task: PowerShell@2
            displayName: 'Remove SonarQube Branch Parameter'
            condition: and(succeeded(), in(variables['Build.SourceBranch'], 'refs/heads/main', 'refs/heads/master'))
            inputs:
              targetType: 'inline'
              script: |
                $params = $env:SONARQUBE_SCANNER_PARAMS

                if ($params) {
                  $settings = $params | ConvertFrom-Json
                  $settings.PSObject.Properties.Remove('sonar.branch.name')
                  $updated = $settings | ConvertTo-Json -Compress
                  Write-Host "##vso[task.setvariable variable=SONARQUBE_SCANNER_PARAMS]$updated"
                  Write-Host "Removed sonar.branch.name for Community Build"
                } else {
                  Write-Host "Scanner parameters not found; check pipeline logs"
                }

          - task: SonarQubeAnalyze@8
            displayName: 'Run SonarQube Analysis'
            condition: and(succeeded(), in(variables['Build.SourceBranch'], 'refs/heads/main', 'refs/heads/master'))

          - task: SonarQubePublish@8
            displayName: 'Publish SonarQube Quality Gate'
            condition: and(succeeded(), in(variables['Build.SourceBranch'], 'refs/heads/main', 'refs/heads/master'))
            inputs:
              pollingTimeoutSec: '300'


          - task: Trivy@1
            displayName: 'Trivy Filesystem Scan'
            inputs:
              version: 'latest'
              docker: false
              scanType: 'fs'
              path: '.'
              severity: 'HIGH,CRITICAL'
              ignoreUnfixed: true
              exitCode: '0'


          - task: PublishPipelineArtifact@1
            displayName: 'Publish Python Artifact'
            inputs:
              targetPath: '$(Build.SourcesDirectory)'
              artifact: 'PythonArtifact'
              publishLocation: 'pipeline'


  - stage: CD
    displayName: 'Deploy Python Application'
    dependsOn: CI
    condition: succeeded()

    jobs:
    - job: Deploy
      displayName: 'Deploy Python to Linux VM'

      steps:
      - checkout: none

      # Download Python Artifact
      - task: DownloadPipelineArtifact@2
        displayName: 'Download Python Artifact'
        inputs:
          buildType: 'current'
          artifactName: 'PythonArtifact'
          targetPath: '$(Pipeline.Workspace)/PythonArtifact'

      # Copy Python files to Linux VM

      - task: CopyFilesOverSSH@0
        displayName: 'Copy Python Files to Linux VM'
        inputs:
          sshEndpoint: 'Linux-VM-SSHbackend'
          sourceFolder: '$(Pipeline.Workspace)/PythonArtifact'
          contents: '**'
          targetFolder: '/opt/python-app'
          cleanTargetFolder: false
          overwrite: true


      - task: SSH@0
        displayName: 'Install ODBC Driver 18 and Deploy Python App'
        inputs:
          sshEndpoint: 'Linux-VM-SSHbackend'
          runOptions: 'inline'
          inline: |
            set -eu

            APP_DIR="/opt/python-app"
            SERVICE="python-app.service"

            echo "Checking passwordless sudo permissions..."
            sudo -n true || {
              echo "ERROR: SSH user needs passwordless sudo permissions."
              exit 1
            }

            echo "Checking Microsoft ODBC Driver 18..."
            if ! odbcinst -q -d 2>/dev/null | grep -Fq 'ODBC Driver 18 for SQL Server'; then
              echo "Installing ODBC Driver 18 prerequisites..."
              sudo -n apt-get update
              sudo -n apt-get install -y curl gnupg unixodbc unixodbc-dev

              echo "Configuring Microsoft repository for Debian 12..."
              curl -fsSL https://packages.microsoft.com/keys/microsoft.asc \
                | sudo -n gpg --dearmor --yes -o /usr/share/keyrings/microsoft-prod.gpg

              echo "deb [arch=amd64,arm64 signed-by=/usr/share/keyrings/microsoft-prod.gpg] https://packages.microsoft.com/debian/12/prod bookworm main" \
                | sudo -n tee /etc/apt/sources.list.d/mssql-release.list >/dev/null

              sudo -n apt-get update
              sudo -n env ACCEPT_EULA=Y apt-get install -y msodbcsql18
            else
              echo "ODBC Driver 18 is already installed."
            fi

            echo "Verifying ODBC Driver..."
            odbcinst -q -d

            echo "Checking application files..."
            test -f "$APP_DIR/requirements.txt" || {
              echo "ERROR: requirements.txt not found."
              exit 1
            }

            test -f "$APP_DIR/app.py" || {
              echo "ERROR: app.py not found."
              exit 1
            }

            test -x "$APP_DIR/venv/bin/python" || {
              echo "ERROR: Python virtual environment is missing."
              exit 1
            }

            echo "Installing Python dependencies..."
            "$APP_DIR/venv/bin/python" -m pip install -r "$APP_DIR/requirements.txt"

            echo "Restarting Python application..."
            sudo -n systemctl restart "$SERVICE"
            sleep 5

            echo "Checking service status..."
            if ! sudo -n systemctl is-active --quiet "$SERVICE"; then
              echo "ERROR: Python application service failed."
              sudo -n systemctl status "$SERVICE" --no-pager || true
              sudo -n journalctl -u "$SERVICE" -n 100 --no-pager || true
              exit 1
            fi

            sudo -n systemctl status "$SERVICE" --no-pager

            echo "Recent application logs..."
            sudo -n journalctl -u "$SERVICE" -n 30 --no-pager || true


            echo "Testing application on port 8000..."
            HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
              --max-time 10 http://127.0.0.1:8000/)

            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 500 ]; then
              echo "SUCCESS: Application is responding. HTTP $HTTP_CODE"
            else
              echo "ERROR: Application check failed. HTTP $HTTP_CODE"
              sudo -n systemctl status "$SERVICE" --no-pager || true
              sudo -n journalctl -u "$SERVICE" -n 100 --no-pager || true
              exit 1
            fi

            echo "SUCCESS: ODBC Driver verified and Python application deployed."

          failOnStdErr: false



